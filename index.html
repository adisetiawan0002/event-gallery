<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gallery Event</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>Gallery Event</h1>
            <p>Foto terbaru</p>
        </div>
    </header>


    <main class="container">

        <div class="gallery-header">

            <div>
                <h2>Foto Terbaru</h2>

                <p id="status">
                    Memuat foto...
                </p>
            </div>

            <button
                id="refreshButton"
                type="button"
            >
                Refresh
            </button>

        </div>


        <section
            id="gallery"
            class="gallery"
        >
            <!-- Foto akan dimasukkan oleh JavaScript -->
        </section>


        <div
            id="empty"
            class="empty"
            hidden
        >
            Belum ada foto.
        </div>

    </main>


    <script src="/app.js"></script>

</body>
</html>
